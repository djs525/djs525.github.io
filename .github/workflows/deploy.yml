# Build the site and publish it to GitHub Pages.
#
# GitHub Pages is a static file host: it serves a folder, it does not run a
# build. This repository holds source, so something has to turn src/*.tsx into
# plain HTML/CSS/JS first. That is this workflow's whole job — it runs the same
# `npm run build` you run locally, on a throwaway Linux machine, and hands the
# resulting dist/ to Pages.
#
# dist/ stays gitignored. Nothing generated ever enters the repository.

name: Deploy to GitHub Pages

on:
  # Every push to main republishes the site.
  push:
    branches: [main]
  # And a manual "Run workflow" button, for redeploying without a code change.
  workflow_dispatch:

# Scoped to this repository and issued by GitHub for the length of the run.
# None of the account's credentials are involved.
permissions:
  contents: read # read the repository
  pages: write # publish to Pages
  id-token: write # prove to Pages that this run is the one it expects

# Two pushes in quick succession must not race each other onto the live site.
# cancel-in-progress stays false so a deploy already mid-flight is allowed to
# finish rather than leaving Pages in a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Restores ~/.npm between runs, keyed on package-lock.json.
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json pins and fails if the lockfile disagrees with
      # package.json, so a deployed build can never differ from a local one.
      - name: Install dependencies
        run: npm ci

      # This is `tsc -b && vite build`. The typecheck runs first, so a type
      # error fails the deploy instead of shipping a broken site.
      - name: Build
        run: npm run build

      - name: Upload dist/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to Pages
        id: deployment
        uses: actions/deploy-pages@v4
