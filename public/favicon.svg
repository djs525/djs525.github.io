<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Studio world. The signature is unreadable at 16px, so the mark falls
       back to the wordmark's own register: initials in a grotesk, ink on
       ink-dark, maximum contrast in both light and dark browser chrome. -->
  <rect width="32" height="32" rx="7" fill="#1b1917"/>
  <text
    x="16"
    y="16"
    fill="#faf9f7"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="15"
    font-weight="700"
    letter-spacing="-0.6"
    text-anchor="middle"
    dominant-baseline="central"
  >DS</text>
</svg>
