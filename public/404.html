<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dev Shah — Portfolio</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // GitHub Pages serves this file for any unknown path, before the app
      // bundle exists. Stash the requested route, then hand control to the SPA
      // at '/', which replays it. Keeps real URLs instead of hash routing.
      sessionStorage.setItem('redirect-path', location.pathname + location.search + location.hash);
      location.replace('/');
    </script>
    <style>
      /* Seen only if the redirect is blocked or scripting is off. Matches the
         studio ground so the hop never flashes white. */
      html {
        background: #faf9f7;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #57514a;
        font: 400 17px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      a {
        color: #1b1917;
      }
    </style>
  </head>
  <body>
    <noscript>
      <p>
        This page needs JavaScript.
        <a href="/">Go to the home page.</a>
      </p>
    </noscript>
  </body>
</html>
